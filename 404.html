<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面没有找到 · 摘星卡片</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0e14">
    <link rel="icon" type="image/png" href="assets/icon48.png">
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .notfound {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: calc(100vh - 72px);
            padding: 80px 0 100px;
            background:
                radial-gradient(700px 440px at 88% 10%, rgba(242, 184, 75, .12), transparent 65%),
                var(--paper);
        }

        .notfound h1 {
            max-width: 8em;
            font-family: var(--serif);
            font-size: clamp(3rem, 7vw, 5.4rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.02em;
        }

        .notfound p:not(.kicker) {
            max-width: 30em;
            margin-top: 22px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.9;
        }

        .notfound__actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 22px;
            margin-top: 34px;
        }

        .notfound__mark {
            position: absolute;
            right: 8%;
            bottom: 10%;
            color: rgba(242, 184, 75, .16);
            font-size: 260px;
            line-height: 1;
            pointer-events: none;
        }

        @media (max-width: 620px) {
            .notfound {
                min-height: calc(100vh - 64px);
                padding: 64px 0 80px;
            }

            .notfound__mark {
                right: -4%;
                bottom: 4%;
                font-size: 180px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header is-solid">
        <div class="container header-inner">
            <a class="brand" href="./" aria-label="返回摘星卡片首页">
                <img src="assets/icon48.png" alt="" width="34" height="34">
                <span class="brand__name">摘星卡片</span>
                <span class="brand__version">v1.6</span>
            </a>
            <div class="header-actions">
                <a class="btn btn--small btn--gold" href="./">回到首页</a>
            </div>
        </div>
    </header>

    <main class="notfound" id="main">
        <div class="container">
            <p class="kicker">404 — 未找到</p>
            <h1>这张卡片，<br>没有摘到。</h1>
            <p>页面可能被移动、改名，或者链接少了一个字符。回到首页，继续读点别的。</p>
            <div class="notfound__actions">
                <a class="btn btn--gold btn--lg" href="./">回到首页 <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
                <a class="text-link" href="./#layouts">看看八种版式</a>
            </div>
        </div>
        <span class="notfound__mark" aria-hidden="true">✦</span>
    </main>

    <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
    </svg>
</body>
</html>
